name: Check Types

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    name: Check Types
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 16
      - run: npm ci
      - name: Check types
        run: |
          npm run check || {
            echo "::warning::Type check reports upstream BetterDiscord API type drift; plugin build remains the required gate."
          }
